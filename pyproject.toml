[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-dev-effectiveness"
version = "1.0.0"
description = "Measure AI co-programming effectiveness on any git repo"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Dennis Gubsky" }]
keywords = [
    "ai-coding", "claude-code", "developer-productivity", "git-analysis",
    "code-metrics", "jupyter-notebook", "productivity-metrics",
    "software-engineering-metrics", "loc-analysis", "commit-analysis",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "plotly>=5.17",
    "click>=8.1",
    "pydantic>=2.5",
    "pyyaml>=6.0",
    "jinja2>=3.1",
]

[project.optional-dependencies]
pdf = ["playwright>=1.40"]
notebook = ["jupyterlab>=4.0", "nbconvert>=7.0", "papermill>=2.5"]
judge-anthropic = ["anthropic>=0.25"]
judge-openai = ["openai>=1.0"]
judge-ollama = ["ollama>=0.1"]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.4",
]

[project.scripts]
ai-dev-effectiveness = "ai_dev_effectiveness.cli:main"

[project.urls]
Homepage = "https://github.com/denn-gubsky/ai-dev-effectiveness"
Repository = "https://github.com/denn-gubsky/ai-dev-effectiveness"
Issues = "https://github.com/denn-gubsky/ai-dev-effectiveness/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_dev_effectiveness"]

[tool.hatch.build.targets.wheel.force-include]
"src/ai_dev_effectiveness/data" = "ai_dev_effectiveness/data"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
